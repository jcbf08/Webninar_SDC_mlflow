name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make setup
      - run: make test
      # Entrena, registra y pasa el quality gate. Si el modelo no cumple, el pipeline falla.
      - run: python src/train.py --model forest
      - run: make register promote
